name: 测试

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python 3.12 · 单元与模拟集成测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 单元测试 + 模拟端到端测试
        run: python -m unittest discover -s tests -v
